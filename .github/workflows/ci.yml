name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Ставит инструменты из mise.toml и (через postinstall-хук) зависимости проекта.
      - name: Set up mise
        uses: jdx/mise-action@v5

      - name: Run checks
        run: mise run check

      # Перегенерировать артефакты из контракта и убедиться, что дерево не изменилось:
      # падает, если сгенерированные файлы разошлись с закоммиченными.
      - name: Check contract codegen drift
        run: mise run contract
